name: Build PALKA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PALKA source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle.kts ] || [ ! -d app/src/main ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'PALKA_FIXED_SOURCE*.zip' -print -quit)"
            test -n "$ZIP_FILE" || { echo "PALKA source ZIP not found"; exit 1; }
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
            if [ -f extracted/settings.gradle.kts ]; then
              cp -R extracted/. .
            else
              ROOT="$(find extracted -mindepth 1 -maxdepth 3 -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
              test -n "$ROOT" || { echo "Could not find settings.gradle.kts inside archive"; exit 1; }
              cp -R "$ROOT"/. .
            fi
          fi
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src/main

      - name: Validate Supabase secrets without printing them
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          url = os.environ.get("SUPABASE_URL", "").strip()
          key = os.environ.get("SUPABASE_ANON_KEY", "").strip()
          checks = {
              "URL is present": bool(url),
              "URL uses https": url.startswith("https://"),
              "URL has Supabase project hostname": bool(re.fullmatch(r"https://[a-z0-9-]+\.supabase\.co/?", url)),
              "anon key is present": bool(key),
          }
          for label, ok in checks.items():
              print(f"{label}: {'OK' if ok else 'FAIL'}")
          if not all(checks.values()):
              sys.exit("Supabase secret validation failed; values were not printed.")
          PY
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > secrets.properties
          chmod 600 secrets.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and verify compiled configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          expected = {
              "SUPABASE_URL": os.environ["SUPABASE_URL"].strip(),
              "SUPABASE_ANON_KEY": os.environ["SUPABASE_ANON_KEY"].strip(),
          }
          files = list(Path("app/build/generated").rglob("BuildConfig.java"))
          files = [p for p in files if "com/palka/app/BuildConfig.java" in str(p)]
          if len(files) != 1:
              sys.exit(f"Expected exactly one PALKA BuildConfig.java, found {len(files)}")
          source = files[0].read_text()
          print(f"BuildConfig path: {files[0]}")
          for name, value in expected.items():
              match = re.search(rf'{name}\s*=\s*"((?:\\.|[^"\\])*)"\s*;', source)
              if not match:
                  sys.exit(f"{name}: field missing from generated BuildConfig")
              compiled = bytes(match.group(1), "utf-8").decode("unicode_escape")
              ok = compiled == value
              print(f"{name}: exact match with GitHub secret = {'OK' if ok else 'FAIL'}; length={len(compiled)}")
              if not ok:
                  sys.exit(f"{name} did not reach BuildConfig unchanged")
          print("Generated BuildConfig matches both GitHub secrets.")
          PY

          python3 - <<'PY'
          import os, sys, zipfile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file():
              sys.exit("APK was not produced")
          url = os.environ["SUPABASE_URL"].strip().encode()
          with zipfile.ZipFile(apk) as z:
              dex_files = [z.read(n) for n in z.namelist() if n.endswith(".dex")]
          url_found = any(url in dex for dex in dex_files)
          print(f"Project URL embedded in APK DEX: {'OK' if url_found else 'FAIL'}")
          if not url_found:
              sys.exit("BuildConfig matched, but project URL was not found in APK DEX.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PALKA-APK-DIAGNOSTIC
          path: app/build/outputs/apk/debug/app-debug.apk
